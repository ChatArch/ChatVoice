name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs,web]"
      - run: python -m pytest -q
      - name: Verify installed CLI contract
        run: |
          chatvoice --version
          chatvoice --tree
          chatvoice --tree-brief
      - name: Verify typed ChatEnv provider
        run: |
          chatenv --home "$RUNNER_TEMP/chatvoice-chatenv" list
          chatenv --home "$RUNNER_TEMP/chatvoice-chatenv" test -t chatvoice -I
          chatenv --home "$RUNNER_TEMP/chatvoice-chatenv" new ci -t chatvoice -I --yes
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify built wheel CLI and profile contracts
        run: |
          python -m venv "$RUNNER_TEMP/chatvoice-wheel"
          "$RUNNER_TEMP/chatvoice-wheel/bin/python" -m pip install dist/*.whl
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/chatvoice-wheel/bin/chatvoice" --version
            "$RUNNER_TEMP/chatvoice-wheel/bin/chatvoice" --tree
            "$RUNNER_TEMP/chatvoice-wheel/bin/chatvoice" --tree-brief
            "$RUNNER_TEMP/chatvoice-wheel/bin/chatenv" --home "$RUNNER_TEMP/chatvoice-wheel-home" list
            "$RUNNER_TEMP/chatvoice-wheel/bin/chatenv" --home "$RUNNER_TEMP/chatvoice-wheel-home" test -t chatvoice -I
            "$RUNNER_TEMP/chatvoice-wheel/bin/chatenv" --home "$RUNNER_TEMP/chatvoice-wheel-home" new ci -t chatvoice -I --yes
          )
      - run: mkdocs build --strict
