site_name: ChatVoice 文档
site_description: 录音转写、会议纪要、Markdown 待办与声音工作室
site_url: https://arch.gh.wzhecnu.cn/ChatVoice/
repo_url: https://github.com/ChatArch/ChatVoice
repo_name: ChatArch/ChatVoice
edit_uri: edit/main/docs/
docs_dir: docs/
theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
          site_name: ChatVoice 文档
        - locale: en
          name: English
          build: true
          site_name: ChatVoice Documentation
          site_description: Transcription, meeting notes, Markdown Todo and voice studio
          nav_translations:
            首页: Home
            开始使用: Getting Started
            快速上手: Quick Start
            网页使用: Web Guide
            能力地图: Capability Map
            功能指南: Features
            独立文本模型: Text Models
            Markdown 待办: Markdown Todo
            语音合成后端: Speech Backends
            声音复刻: Voice Cloning
            配置与运维: Configuration and Operations
            配置参考: Configuration
            部署与启动: Deployment
            运行目录与数据结构: Runtime and Storage
            数据保留边界: Data Retention
            故障排查: Troubleshooting
            接口参考: Interfaces
            CLI 树: CLI Tree
            HTTP 接口: HTTP API
            Python 接口树: Python Interfaces
            开发验证: Development
            测试与验收: Testing and Acceptance
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra:
  alternate:
    - name: 中文
      link: /ChatVoice/
      lang: zh
    - name: English
      link: /ChatVoice/en/
      lang: en
nav:
  - 首页: index.md
  - 开始使用:
      - 快速上手: quickstart.md
      - 网页使用: web-guide.md
      - 能力地图: capability-map.md
  - 功能指南:
      - 独立文本模型: text-models.md
      - Markdown 待办: markdown-todo.md
      - 语音合成后端: tts-models.md
      - 声音复刻: voice-cloning.md
  - 配置与运维:
      - 配置参考: configuration.md
      - 部署与启动: deployment.md
      - 运行目录与数据结构: runtime-layout.md
      - 数据保留边界: recording-storage.md
      - 故障排查: troubleshooting.md
  - 接口参考:
      - CLI 树: cli-tree.md
      - HTTP 接口: api-access.md
      - Python 接口树: interface-tree.md
  - 开发验证:
      - 测试与验收: testing.md
